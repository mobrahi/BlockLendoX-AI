<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockLendoX-AI | API Gateway</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="status-pill">
            <span class="dot"></span> System Online v1.0
        </div>
        
        <h1>BlockLendoX<span class="accent">-AI</span></h1>
        <p class="subtitle">Decentralized Micro-Lending Engine</p>
        
        <div class="stats-grid">
            <div class="stat-box">
                <span class="label">Engine</span>
                <span class="value">FastAPI</span>
            </div>
            <div class="stat-box">
                <span class="label">Model</span>
                <span class="value">Scikit-Learn</span>
            </div>
            <div class="stat-box">
                <span class="label">Ledger</span>
                <span class="value">Ganache/Web3</span>
            </div>
        </div>

        <div class="button-group">
            <a href="/docs" class="btn btn-primary">
                Explore API Docs <span>→</span>
            </a>
            <a href="http://localhost:8501" target="_blank" class="btn btn-secondary">
                Launch Frontend <span>↗</span>
            </a>
        </div>
        
        <div class="footer">
            <p>Powered by Python 3.12 & Solidity</p>
        </div>
    </div>
</body>
</html>
